name: Game review
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code -- index.html dist
      - run: npm run check
      - run: npm test
      - run: npm run audit:map
      - name: Install Chromium for the gameplay review
        run: npx playwright install --with-deps chromium
      - name: Verify the built game in Chromium
        run: |
          node tools/serve.cjs > /tmp/crown-city-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/ > /dev/null
          npm run test:browser
          npm run test:intro
          CC_URL=http://127.0.0.1:8000/ npm run test:baked
          CC_URL=http://127.0.0.1:8000/ npm run test:street
          CC_URL=http://127.0.0.1:8000/ npm run test:rockets
