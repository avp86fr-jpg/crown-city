<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#12071C">
  <title>METAWINNERS: CROWN CITY</title>
  <meta name="description" content="Fan-made top-down heist in Crown City. Play as Chaos. Click, drive, race, and crack the Palace. Play chips only. Not affiliated with MetaWin.">
  <meta property="og:title" content="METAWINNERS: CROWN CITY">
  <meta property="og:description" content="A fan-made classic top-down city heist. Chaos, a casino city, and play chips only.">
  <meta property="og:image" content="assets/ui/title.jpg">
  <link rel="icon" href="assets/ui/icon.png">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="1280" height="720"></canvas>
    <div id="touch" class="hidden">
      <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
      <button class="btn enter" id="tEnter" type="button">E</button>
      <button class="btn brake" id="tBrake" type="button">BRAKE</button>
      <button class="btn fire" id="tFire" type="button">FIRE</button>
      <button class="btn pause" id="tPause" type="button">II</button>
      <button class="btn fs" id="tFs" type="button">FS</button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
